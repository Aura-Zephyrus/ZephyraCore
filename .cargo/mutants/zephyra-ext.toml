# cargo-mutants 配置：zephyra-ext（BASE 集，统一门面扩展 API）。
# 运行（workspace root）：
#   cargo mutants -p zephyra-ext --config .cargo/mutants/zephyra-ext.toml --in-place
# `--in-place` 只能由命令行给出（见 cargo-mutants options.rs），故不写在这里。

examine_globs = ["zephyra-base/zephyra-ext/src/**/*.rs"]

# prelude.rs 只有 pub use，没有可变异逻辑。
exclude_globs = ["zephyra-base/zephyra-ext/src/prelude.rs"]

test_package = ["zephyra-ext"]

output = "mutants.out/zephyra-ext"

timeout_multiplier = 4.0
build_timeout_multiplier = 4.0

copy_target = false
skip_calls_defaults = true

# 等价变异裁决：确认无行为差异后，把其 `--list` 名称的正则写入 exclude_re
# （schema: 字符串数组，正则匹配 `cargo mutants --list` 输出的名称），逐条写明理由。
# 不允许宽泛正则批量豁免；流程见 zephyra-core/MUTATION_TESTING.md。
# exclude_re = ["replace <exact mutant name from --list> with its anchored regex"]
